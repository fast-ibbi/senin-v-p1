<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 184" width="1160" height="184" role="img" aria-label="The risk chain for a token in AsyncStorage: the stored value is plain text and not encrypted, so any code running inside the app can read it; a rooted or jailbroken device raises the risk, and a stolen token lets an attacker call the API on the user's behalf."><title>The risk chain for a token in AsyncStorage: the stored value is plain text and not encrypted, so any code running inside the app can read it; a rooted or jailbroken device raises the risk, and a stolen token lets an attacker call the API on the user's behalf.</title><defs><marker id="a-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d4ed8"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/></marker><marker id="a-code" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000" flood-opacity="0.06"/></filter></defs><style>.t{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;fill:#111827}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#111827}.mu{fill:#6b7280}.mid{text-anchor:middle}.end{text-anchor:end}.b6{font-weight:600}.b7{font-weight:700}.s13{font-size:13px}.s14{font-size:14px}.s15{font-size:15px}.s16{font-size:16px}.s17{font-size:17px}.s18{font-size:18px}.s19{font-size:19px}.s20{font-size:20px}.s22{font-size:22px}.s24{font-size:24px}</style><rect x="0" y="0" width="1160" height="184" fill="#ffffff"/><rect x="24" y="24" width="203" height="76" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text class="t s17 b7 mid " x="125.5" y="64.38" >AsyncStorage</text><text class="t s14  mid " x="125.5" y="133.96" fill="#6b7280">plain text, not encrypted</text><line x1="233" y1="62" x2="321" y2="62" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a-slate)"/><text class="t s14 b7 mid " x="277" y="52" fill="#1d4ed8">can read it</text><rect x="327" y="24" width="203" height="76" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text class="t s17 b7 mid " x="428.5" y="64.38" >App code</text><text class="t s14  mid " x="428.5" y="133.96" fill="#6b7280">any code running inside</text><line x1="536" y1="62" x2="624" y2="62" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a-slate)"/><text class="t s14 b7 mid " x="580" y="52" fill="#1d4ed8">raises the risk</text><rect x="630" y="24" width="203" height="76" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text class="t s17 b7 mid " x="731.5" y="64.38" >Rooted device</text><text class="t s14  mid " x="731.5" y="133.96" fill="#6b7280">or jailbroken (iOS)</text><line x1="839" y1="62" x2="927" y2="62" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a-slate)"/><text class="t s14 b7 mid " x="883" y="52" fill="#1d4ed8">a stolen token</text><rect x="933" y="24" width="203" height="76" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text class="t s17 b7 mid " x="1034.5" y="64.38" fill="#b91c1c">Attacker</text><text class="t s14  mid " x="1034.5" y="124.72" fill="#6b7280">calls the API on the user's</text><text class="t s14  mid " x="1034.5" y="143.2" fill="#6b7280">behalf</text></svg>
