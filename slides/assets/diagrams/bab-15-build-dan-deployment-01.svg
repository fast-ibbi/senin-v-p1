ght="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000" flood-opacity="0.06"/></filter></defs><style>.t{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;fill:#111827}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#111827}.mu{fill:#6b7280}.mid{text-anchor:middle}.end{text-anchor:end}.b6{font-weight:600}.b7{font-weight:700}.s13{font-size:13px}.s14{font-size:14px}.s15{font-size:15px}.s16{font-size:16px}.s17{font-size:17px}.s18{font-size:18px}.s19{font-size:19px}.s20{font-size:20px}.s22{font-size:22px}.s24{font-size:24px}</style><rect x="0" y="0" width="1160" height="262" fill="#ffffff"/><rect x="172" y="24" width="260" height="46" rx="9" fill="#eef2ff" stroke="rgba(29,78,216,0.28)" stroke-width="1.5"/><text class="t s16 b7 mid " x="302" y="49.24" fill="#1d4ed8">Local machine</text><line x1="302" y1="76" x2="302" y2="238" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5" stroke-linecap="round"/><rect x="728" y="24" width="260" height="46" rx="9" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text class="t s16 b7 mid " x="858" y="49.24" >Expo's server</text><line x1="858" y1="76" x2="858" y2="238" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5" stroke-linecap="round"/><line x1="314" y1="119.67" x2="846" y2="119.67" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a-slate)"/><text class="t s14 b7 mid " x="580" y="111.67" >project code</text><path d="M858 155 h34 v24 h-34" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M864 179 l8 -4 v8 z" fill="#94a3b8"/><text class="t s14 b7  " x="904" y="172" >compiling</text><line x1="846" y1="214.33" x2="314" y2="214.33" stroke="#1d4ed8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a-acc)"/><text class="t s14 b7 mid " x="580" y="206.33" >download link</text></svg>
