oke-linecap="round" stroke-linejoin="round"/><path d="M702 303 l-7 -4 v8 z" fill="#94a3b8"/><rect x="24" y="161.5" width="218" height="66" rx="10" fill="#eef2ff" stroke="rgba(29,78,216,0.28)" stroke-width="1.5"/><text class="t s18 b7 mid " x="133" y="197.02" fill="#1d4ed8">Mobile app</text><rect x="710" y="28" width="300" height="54" rx="9" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text class="t s16   " x="724" y="46.68" >Installed on the device, not opened</text><text class="t s16   " x="724" y="67.8" >through a browser</text><rect x="710" y="90" width="300" height="54" rx="9" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text class="t s16   " x="724" y="119.24" >Lives inside the app store ecosystem</text><rect x="710" y="152" width="300" height="54" rx="9" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text class="t s16   " x="724" y="170.68" >Draws on the physical capabilities of</text><text class="t s16   " x="724" y="191.8" >the device</text><rect x="326" y="90" width="300" height="54" rx="9" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text class="t s16   " x="340" y="119.24" >Not just a shrunken website</text><rect x="710" y="214" width="300" height="54" rx="9" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text class="t s16   " x="724" y="243.24" >Mobility: used while on the move</text><rect x="710" y="276" width="300" height="54" rx="9" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text class="t s16   " x="724" y="294.68" >Sessions are short and often</text><text class="t s16   " x="724" y="315.8" >interrupted</text><rect x="326" y="245" width="300" height="54" rx="9" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text class="t s16   " x="340" y="274.24" >Where its value comes from</text></svg>
