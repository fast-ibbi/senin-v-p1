<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 272" width="1160" height="272" role="img" aria-label="Three interface states and how the screen moves between them: loading can end in the empty state when the request returns no data, or in the error state on a network failure or a 4xx/5xx status; the error state returns to loading when the user tries again. The normal case — the list showing data — is not one of the three states."><title>Three interface states and how the screen moves between them: loading can end in the empty state when the request returns no data, or in the error state on a network failure or a 4xx/5xx status; the error state returns to loading when the user tries again. The normal case — the list showing data — is not one of the three states.</title><defs><marker id="a-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d4ed8"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/></marker><marker id="a-code" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000" flood-opacity="0.06"/></filter></defs><style>.t{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;fill:#111827}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#111827}.mu{fill:#6b7280}.mid{text-anchor:middle}.end{text-anchor:end}.b6{font-weight:600}.b7{font-weight:700}.s13{font-size:13px}.s14{font-size:14px}.s15{font-size:15px}.s16{font-size:16px}.s17{font-size:17px}.s18{font-size:18px}.s19{font-size:19px}.s20{font-size:20px}.s22{font-size:22px}.s24{font-size:24px}</style><rect x="0" y="0" width="1160" height="272" fill="#ffffff"/><line x1="419" y1="151" x2="501" y2="151" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-slate)"/><text class="t s14  mid " x="460" y="136.96" >no data</text><path d="M420 175.44 L430 177.81 L440 180.03 L450 182.09 L460 184 L470 185.76 L480 187.36 L490 188.81 L500 190.11 L510 191.26 L520 192.25 L530 193.09 L540 193.78 L550 194.31 L560 194.69 L570 194.92 L580 195 L590 194.92 L600 194.69 L610 194.31 L620 193.78 L630 193.09 L640 192.25 L650 191.26 L660 190.11 L670 188.81 L680 187.36 L690 185.76 L700 184 L710 182.09 L720 180.03 L730 177.81" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-red)"/><text class="t s14  mid " x="580" y="212.96" >4xx / 5xx</text><path d="M740 122.11 L730 119.31 L720 116.69 L710 114.26 L700 112 L690 109.92 L680 108.03 L670 106.31 L660 104.78 L650 103.42 L640 102.25 L630 101.26 L620 100.44 L610 99.81 L600 99.36 L590 99.09 L580 99 L570 99.09 L560 99.36 L550 99.81 L540 100.44 L530 101.26 L520 102.25 L510 103.42 L500 104.78 L490 106.31 L480 108.03 L470 109.92 L460 112 L450 114.26 L440 116.69 L430 119.31" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-slate)"/><text class="t s14  mid " x="580" y="86.96" >try again</text><rect x="265" y="120" width="150" height="62" rx="12" fill="#eef2ff" stroke="rgba(29,78,216,0.28)" stroke-width="1.5"/><text class="t s16 b7 mid " x="340" y="153.24" fill="#1d4ed8">loading</text><rect x="505" y="120" width="150" height="62" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text class="t s16 b7 mid " x="580" y="153.24" >empty state</text><rect x="745" y="120" width="150" height="62" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text class="t s16 b7 mid " x="820" y="153.24" fill="#b91c1c">error state</text><circle cx="231" cy="151" r="6" fill="#111827"/><line x1="239" y1="151" x2="262" y2="151" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a-ink)"/></svg>
