<text class="t s12 b6 mu ls" x="18" y="92">Source</text>
<text class="t s16" x="18" y="118">from the parent component</text>
<text class="t s12 b6 mu ls" x="638" y="92">Source</text>
<text class="t s16" x="638" y="118">inside the component itself</text>
<line x1="18" y1="132" x2="522" y2="132" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="638" y1="132" x2="1142" y2="132" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text class="t s12 b6 mu ls" x="18" y="154">Can it change?</text>
<text class="t s16" x="18" y="180">no — read-only</text>
<text class="t s12 b6 mu ls" x="638" y="154">Can it change?</text>
<text class="t s16" x="638" y="180">yes, via the setter</text>
<line x1="18" y1="194" x2="522" y2="194" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="638" y1="194" x2="1142" y2="194" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text class="t s12 b6 mu ls" x="18" y="216">Triggers re-render?</text>
<text class="t s16" x="18" y="242">yes, when the parent sends a new value</text>
<text class="t s12 b6 mu ls" x="638" y="216">Triggers re-render?</text>
<text class="t s16" x="638" y="242">yes, when the setter is called</text>
<line x1="18" y1="256" x2="522" y2="256" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<line x1="638" y1="256" x2="1142" y2="256" stroke="#e5e7eb" stroke-width="1" stroke-linecap="round"/>
<text class="t s12 b6 mu ls" x="18" y="278">Owner</text>
<text class="t s16" x="18" y="304">the parent component</text>
<text class="t s12 b6 mu ls" x="638" y="278">Owner</text>
<text class="t s16" x="638" y="304">the component that declares it</text>
<rect x="437" y="16" width="14" height="11" rx="2" fill="#b91c1c"/><path d="M 440 16 v-4 a4 4 0 0 1 8 0 v4" fill="none" stroke="#b91c1c" stroke-width="2"/>
<text class="t s12 b6 rd" x="458" y="28">read-only</text>
<text class="t s12 b6 am" x="1078" y="28">mutable</text>
<rect x="0" y="362" width="1160" height="56" rx="10" fill="#eef2ff" stroke="none" stroke-width="1.5"/>
<rect x="0" y="362" width="6" height="56" rx="0" fill="#1d4ed8" stroke="none" stroke-width="1.5"/>
<text class="t s18 b6" x="24" y="396">Both determine the view; the difference is who owns and who may change.</text></svg>
