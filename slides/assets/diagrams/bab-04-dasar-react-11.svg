</style><rect x="0" y="0" width="540" height="340" rx="12" fill="#ffffff" stroke="none" stroke-width="1.5"/><rect x="0" y="0" width="540" height="46" rx="12" fill="#eef2ff" stroke="none" stroke-width="1.5"/><rect x="0" y="34" width="540" height="12" rx="0" fill="#eef2ff" stroke="none" stroke-width="1.5"/><text class="t s17 b7 ac" x="18" y="29">PROPS — data from the parent</text><line x1="0" y1="46" x2="540" y2="46" stroke="#c7d2fe" stroke-width="1" stroke-linecap="round"/><rect x="0" y="0" width="540" height="340" rx="12" fill="none" stroke="#c7d2fe" stroke-width="1.5"/>
