</style><text class="m s34 b7 mid" x="580" y="50"><tspan fill="#111827">UI</tspan><tspan fill="#6b7280"> = </tspan><tspan fill="#1d4ed8">f</tspan><tspan fill="#111827">(</tspan><tspan fill="#b45309">state</tspan><tspan fill="#111827">)</tspan></text>
<text class="t s17 mu mid" x="580" y="80">the view is a function of data — not a sequence of commands</text>
