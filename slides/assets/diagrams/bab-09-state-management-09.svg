<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 280" width="1160" height="280" role="img" aria-label="The three kinds of data that must not be made global, each with its own home: data that can be recomputed — totalHarga and jumlahItem — is computed from items on every render, server-owned data is fetched and cached by one dedicated layer, and temporary one-screen data stays in that screen’s local state."><title>The three kinds of data that must not be made global, each with its own home: data that can be recomputed — totalHarga and jumlahItem — is computed from items on every render, server-owned data is fetched and cached by one dedicated layer, and temporary one-screen data stays in that screen’s local state.</title><defs><marker id="a-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d4ed8"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/></marker><marker id="a-code" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000" flood-opacity="0.06"/></filter></defs><style>.t{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;fill:#111827}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#111827}.mu{fill:#6b7280}.mid{text-anchor:middle}.end{text-anchor:end}.b6{font-weight:600}.b7{font-weight:700}.s13{font-size:13px}.s14{font-size:14px}.s15{font-size:15px}.s16{font-size:16px}.s17{font-size:17px}.s18{font-size:18px}.s19{font-size:19px}.s20{font-size:20px}.s22{font-size:22px}.s24{font-size:24px}</style><rect x="0" y="0" width="1160" height="280" fill="#ffffff"/><rect x="24" y="24" width="540" height="232" rx="12" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/><path d="M24 36 a12 12 0 0 1 12 -12 h516 a12 12 0 0 1 12 12 v34 h-540 z" fill="#fffbeb"/><line x1="24" y1="70" x2="564" y2="70" stroke="#fde68a" stroke-width="1"/><text class="t s18 b7  " x="42" y="49.52" fill="#b45309">DON'T MAKE IT GLOBAL</text><circle cx="54" cy="111" r="13" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/><text class="t s14 b7 mid " x="54" y="116.04" fill="#b45309">1</text><text class="t s16   " x="76" y="113.24" >can be recomputed — totalHarga, jumlahItem</text><circle cx="54" cy="169" r="13" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/><text class="t s14 b7 mid " x="54" y="174.04" fill="#b45309">2</text><text class="t s16   " x="76" y="171.24" >data owned by the server</text><circle cx="54" cy="227" r="13" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/><text class="t s14 b7 mid " x="54" y="232.04" fill="#b45309">3</text><text class="t s16   " x="76" y="229.24" >temporary data for one screen</text><rect x="596" y="24" width="540" height="232" rx="12" fill="#ffffff" stroke="rgba(29,78,216,0.28)" stroke-width="1.5"/><path d="M596 36 a12 12 0 0 1 12 -12 h516 a12 12 0 0 1 12 12 v34 h-540 z" fill="#eef2ff"/><line x1="596" y1="70" x2="1136" y2="70" stroke="rgba(29,78,216,0.28)" stroke-width="1"/><text class="t s18 b7  " x="614" y="49.52" fill="#1d4ed8">WHERE IT BELONGS</text><circle cx="626" cy="111" r="13" fill="#eef2ff" stroke="rgba(29,78,216,0.28)" stroke-width="1.5"/><text class="t s14 b7 mid " x="626" y="116.04" fill="#1d4ed8">1</text><text class="t s16   " x="648" y="113.24" >recomputed from items on every render</text><circle cx="626" cy="169" r="13" fill="#eef2ff" stroke="rgba(29,78,216,0.28)" stroke-width="1.5"/><text class="t s14 b7 mid " x="626" y="174.04" fill="#1d4ed8">2</text><text class="t s16   " x="648" y="171.24" >fetched and cached by one dedicated layer</text><circle cx="626" cy="227" r="13" fill="#eef2ff" stroke="rgba(29,78,216,0.28)" stroke-width="1.5"/><text class="t s14 b7 mid " x="626" y="232.04" fill="#1d4ed8">3</text><text class="t s16   " x="648" y="229.24" >local state in that screen</text></svg>
