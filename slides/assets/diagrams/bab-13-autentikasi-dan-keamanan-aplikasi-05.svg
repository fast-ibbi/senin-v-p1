<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 430" width="1160" height="430" role="img" aria-label="The complete flow as an exchange: the user sends an email and a password to the application, which sends the credentials to the auth server; the auth server answers with a JWT token, the application stores it in SecureStore, later sends it back as the Authorization: Bearer header, and at logout deletes it on the client without calling the server."><title>The complete flow as an exchange: the user sends an email and a password to the application, which sends the credentials to the auth server; the auth server answers with a JWT token, the application stores it in SecureStore, later sends it back as the Authorization: Bearer header, and at logout deletes it on the client without calling the server.</title><defs><marker id="a-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d4ed8"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/></marker><marker id="a-code" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000" flood-opacity="0.06"/></filter></defs><style>.t{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;fill:#111827}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#111827}.mu{fill:#6b7280}.mid{text-anchor:middle}.end{text-anchor:end}.b6{font-weight:600}.b7{font-weight:700}.s13{font-size:13px}.s14{font-size:14px}.s15{font-size:15px}.s16{font-size:16px}.s17{font-size:17px}.s18{font-size:18px}.s19{font-size:19px}.s20{font-size:20px}.s22{font-size:22px}.s24{font-size:24px}</style><rect x="0" y="0" width="1160" height="430" fill="#ffffff"/><rect x="79.33" y="24" width="260" height="46" rx="9" fill="#eef2ff" stroke="rgba(29,78,216,0.28)" stroke-width="1.5"/><text class="t s16 b7 mid " x="209.33" y="49.24" fill="#1d4ed8">User</text><line x1="209.33" y1="76" x2="209.33" y2="406" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5" stroke-linecap="round"/><rect x="450" y="24" width="260" height="46" rx="9" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text class="t s16 b7 mid " x="580" y="49.24" >Application</text><line x1="580" y1="76" x2="580" y2="406" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5" stroke-linecap="round"/><rect x="820.67" y="24" width="260" height="46" rx="9" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text class="t s16 b7 mid " x="950.67" y="49.24" >Auth server</text><line x1="950.67" y1="76" x2="950.67" y2="406" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5" stroke-linecap="round"/><line x1="221.33" y1="121.83" x2="568" y2="121.83" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a-slate)"/><text class="t s14 b7 mid " x="394.67" y="113.83" >email and a password</text><line x1="592" y1="173.5" x2="938.67" y2="173.5" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a-slate)"/><text class="t s14 b7 mid " x="765.33" y="165.5" >credentials</text><line x1="938.67" y1="225.17" x2="592" y2="225.17" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a-slate)"/><text class="t s14 b7 mid " x="765.33" y="217.17" >JWT token</text><path d="M580 264.83 h34 v24 h-34" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M586 288.83 l8 -4 v8 z" fill="#94a3b8"/><text class="t s14 b7  " x="626" y="281.83" >stores the token in SecureStore</text><line x1="592" y1="328.5" x2="938.67" y2="328.5" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a-slate)"/><text class="t s14 b7 mid " x="765.33" y="320.5" >Authorization: Bearer &lt;token&gt;</text><path d="M580 368.17 h34 v24 h-34" fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M586 392.17 l8 -4 v8 z" fill="#1d4ed8"/><text class="t s14 b7  " x="626" y="385.17" >logout deletes the token</text></svg>
