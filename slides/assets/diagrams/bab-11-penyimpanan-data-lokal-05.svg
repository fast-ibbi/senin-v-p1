a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000" flood-opacity="0.06"/></filter></defs><style>.t{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;fill:#111827}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#111827}.mu{fill:#6b7280}.mid{text-anchor:middle}.end{text-anchor:end}.b6{font-weight:600}.b7{font-weight:700}.s13{font-size:13px}.s14{font-size:14px}.s15{font-size:15px}.s16{font-size:16px}.s17{font-size:17px}.s18{font-size:18px}.s19{font-size:19px}.s20{font-size:20px}.s22{font-size:22px}.s24{font-size:24px}</style><rect x="0" y="0" width="1160" height="184" fill="#ffffff"/><rect x="24" y="24" width="203" height="76" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text class="t s17 b7 mid " x="125.5" y="64.38" >daftarCatatan</text><text class="t s14  mid " x="125.5" y="133.96" fill="#6b7280">the array in memory</text><line x1="233" y1="62" x2="321" y2="62" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a-slate)"/><text class="t s14 b7 mid " x="277" y="52" fill="#1d4ed8">stringify</text><rect x="327" y="24" width="203" height="76" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text class="t s17 b7 mid " x="428.5" y="64.38" >JSON string</text><text class="t s14  mid " x="428.5" y="133.96" fill="#6b7280">one long string</text><line x1="536" y1="62" x2="624" y2="62" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a-slate)"/><text class="t s14 b7 mid " x="580" y="52" fill="#1d4ed8">setItem</text><rect x="630" y="24" width="203" height="76" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text class="t s17 