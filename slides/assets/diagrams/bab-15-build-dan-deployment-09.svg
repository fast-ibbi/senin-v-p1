<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 184" width="1160" height="184" role="img" aria-label="Why the application ID is permanent: the reverse-domain ID goes live when it is published, it may not be changed once published, and changing it makes the store treat the app as a new app whose old users and reviews vanish."><title>Why the application ID is permanent: the reverse-domain ID goes live when it is published, it may not be changed once published, and changing it makes the store treat the app as a new app whose old users and reviews vanish.</title><defs><marker id="a-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d4ed8"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/></marker><marker id="a-code" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000" flood-opacity="0.06"/></filter></defs><style>.t{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;fill:#111827}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#111827}.mu{fill:#6b7280}.mid{text-anchor:middle}.end{text-anchor:end}.b6{font-weight:600}.b7{font-weight:700}.s13{font-size:13px}.s14{font-size:14px}.s15{font-size:15px}.s16{font-size:16px}.s17{font-size:17px}.s18{font-size:18px}.s19{font-size:19px}.s20{font-size:20px}.s22{font-size:22px}.s24{font-size:24px}</style><rect x="0" y="0" width="1160" height="184" fill="#ffffff"/><rect x="24" y="24" width="292" height="76" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text class="t s17 b7 mid " x="170" y="64.38" >Application ID</text><text class="t s14  mid " x="170" y="133.96" fill="#6b7280">ac.id.univ + mahasiswa</text><line x1="322" y1="62" x2="428" y2="62" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a-slate)"/><text class="t s14 b7 mid " x="375" y="52" fill="#1d4ed8">publish</text><rect x="434" y="24" width="292" height="76" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text class="t s17 b7 mid " x="580" y="64.38" >Published</text><text class="t s14  mid " x="580" y="133.96" fill="#6b7280">the ID may not be changed</text><line x1="732" y1="62" x2="838" y2="62" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" marker-end="url(#a-slate)"/><text class="t s14 b7 mid " x="785" y="52" fill="#1d4ed8">changed</text><rect x="844" y="24" width="292" height="76" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text class="t s17 b7 mid " x="990" y="64.38" fill="#b91c1c">A new app</text><text class="t s14  mid " x="990" y="133.96" fill="#6b7280">old users and reviews seem to vanish</text></svg>
