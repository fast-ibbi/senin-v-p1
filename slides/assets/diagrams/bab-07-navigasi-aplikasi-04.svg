<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 272" width="1160" height="272" role="img" aria-label="A tab screen mounts once — a plain useEffect runs there and never again — then cycles between focused and unfocused every time the user leaves the tab and focus returns."><title>A tab screen mounts once — a plain useEffect runs there and never again — then cycles between focused and unfocused every time the user leaves the tab and focus returns.</title><defs><marker id="a-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d4ed8"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/></marker><marker id="a-code" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000" flood-opacity="0.06"/></filter></defs><style>.t{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;fill:#111827}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#111827}.mu{fill:#6b7280}.mid{text-anchor:middle}.end{text-anchor:end}.b6{font-weight:600}.b7{font-weight:700}.s13{font-size:13px}.s14{font-size:14px}.s15{font-size:15px}.s16{font-size:16px}.s17{font-size:17px}.s18{font-size:18px}.s19{font-size:19px}.s20{font-size:20px}.s22{font-size:22px}.s24{font-size:24px}</style><rect x="0" y="0" width="1160" height="272" fill="#ffffff"/><line x1="419" y1="151" x2="501" y2="151" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-slate)"/><text class="t s14  mid " x="460" y="136.96" >gains focus</text><line x1="659" y1="151" x2="741" y2="151" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a-slate)"/><text class="t s14  mid " x="700" y="136.96" >loses focus</text><path d="M770 116.69 L765 114.26 L760 112 L755 109.92 L750 108.03 L745 106.31 L740 104.78 L735 103.42 L730 102.25 L725 101.26 L720 100.44 L715 99.81 L710 99.36 L705 99.09 L700 99 L695 99.09 L690 99.36 L685 99.81 L680 100.44 L675 101.26 L670 102.25 L665 103.42 L660 104.78 L655 106.31 L650 108.03 L645 109.92 L640 112" fill="none" stroke="#1d4ed8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-acc)"/><text class="t s14  mid " x="700" y="86.96" >focus returns</text><rect x="265" y="120" width="150" height="62" rx="12" fill="#eef2ff" stroke="rgba(29,78,216,0.28)" stroke-width="1.5"/><text class="t s16 b7 mid " x="340" y="153.24" fill="#1d4ed8">mounted</text><rect x="505" y="120" width="150" height="62" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/><text class="t s16 b7 mid " x="580" y="153.24" >focused</text><rect x="745" y="120" width="150" height="62" rx="12" fill="#ffffff" stroke="#e5e7eb" stro