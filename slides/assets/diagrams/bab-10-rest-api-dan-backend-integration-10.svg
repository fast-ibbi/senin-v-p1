<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 222" width="1160" height="222" role="img" aria-label="A fetch call has two very different failure surfaces: when the network is in trouble fetch throws and you catch it with try/catch; when the server answers 4xx or 5xx fetch resolves and reports success, so you check response.ok and throw the Error yourself."><title>A fetch call has two very different failure surfaces: when the network is in trouble fetch throws and you catch it with try/catch; when the server answers 4xx or 5xx fetch resolves and reports success, so you check response.ok and throw the Error yourself.</title><defs><marker id="a-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="a-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d4ed8"/></marker><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/></marker><marker id="a-code" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#111827"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b91c1c"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000" flood-opacity="0.06"/></filter></defs><style>.t{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif;fill:#111827}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#111827}.mu{fill:#6b7280}.mid{text-anchor:middle}.end{text-anchor:end}.b6{font-weight:600}.b7{font-weight:700}.s13{font-size:13px}.s14{font-size:14px}.s15{font-size:15px}.s16{font-size:16px}.s17{font-size:17px}.s18{font-size:18px}.s19{font-size:19px}.s20{font-size:20px}.s22{font-size:22px}.s24{font-size:24px}</style><rect x="0" y="0" width="1160" height="222" fill="#ffffff"/><rect x="24" y="24" width="540" height="174" rx="12" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/><path d="M24 36 a12 12 0 0 1 12 -12 h516 a12 12 0 0 1 12 12 v34 h-540 z" fill="#fef2f2"/><line x1="24" y1="70" x2="564" y2="70" stroke="#fecaca" stroke-width="1"/><text class="t s18 b7  " x="42" y="49.52" fill="#b91c1c">The network is in trouble</text><circle cx="54" cy="111" r="13" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text class="t s14 b7 mid " x="54" y="116.04" fill="#b91c1c">1</text><text class="t s16   " x="76" y="113.24" >network failures are thrown by fetch</text><circle cx="54" cy="169" r="13" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/><text class="t s14 b7 mid " x="54" y="174.04" fill="#b91c1c">2</text><text class="t s16   " x="76" y="171.24" >catch network failures with try/catch</text><rect x="596" y="24" width="540" height="174" rx="12" fill="#ffffff" stroke="rgba(29,78,216,0.28)" stroke-width="1.5"/><path d="M596 36 a12 12 0 0 1 12 -12 h516 a12 12 0 0 1 12 12 v34 h-540 z" fill="#eef2ff"/><line x1="596" y1="70" x2="1136" y2="70" stroke="rgba(29,78,216,0.28)" stroke-width="1"/><text class="t s18 b7  " x="614" y="49.52" fill="#1d4ed8">4xx and 5xx</text><circle cx="626" cy="111" r="13" fill="#eef2ff" stroke="rgba(29,78,216,0.28)" stroke-width="1.5"/><text class="t s14 b7 mid " x="626" y="116.04" fill="#1d4ed8">1</text><text class="t s16   " x="648" y="113.24" >treated as a successful request</text><circle cx="626" cy="169" r="13" fill="#eef2ff" stroke="rgba(29,78,216,0.28)" stroke-width="1.5"/><text class="t s14 b7 mid " x="626" y="174.04" fill="#1d4ed8">2</text><text class="t s16   " x="648" y="171.24" >check response.ok then throw an Error yourself</text></svg>
