name: Verifikasi kode praktikum

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - 'kode/**'
      - 'scripts/verify-kode.mjs'
      - 'scripts/sync-backend.mjs'
      - 'scripts/smoke-api.mjs'
      - '.github/workflows/kode.yml'
  pull_request:
    paths:
      - 'kode/**'

jobs:
  statis:
    name: Gerbang statis (15 folder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependensi root
        run: npm install

      - name: Jalankan verify-kode
        run: npm run verify:kode

  sentinel:
    name: Build nyata — ${{ matrix.folder }}
    runs-on: ubuntu-latest
    needs: statis
    strategy:
      fail-fast: false
      matrix:
        include:
          - folder: bab-02-persiapan-lingkungan-pengembangan
            bab: 2
          - folder: bab-07-navigasi-aplikasi
            bab: 7
          - folder: bab-10-rest-api-dan-backend-integration
            bab: 10
          - folder: bab-13-autentikasi-dan-keamanan-aplikasi
            bab: 13
          - folder: bab-15-build-dan-deployment
            bab: 15
    defaults:
      run:
        working-directory: kode/${{ matrix.folder }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pasang dependensi aplikasi
        run: npm install

      - name: Uji unit (bab 14 ke atas)
        if: matrix.bab >= 14
        run: npm test

      - name: Bundle Android (membuktikan Metro bisa membangun)
        run: npx expo export --platform android --clear --output-dir "$RUNNER_TEMP/bundle"

      - name: Uji asap API (bab 13)
        if: matrix.bab == 13
        run: |
          npm run api &
          sleep 3
          node ../../scripts/smoke-api.mjs

      - name: Reset data seed setelah uji
        if: matrix.bab >= 10
        run: npm run api:reset
